{{ define "main" }}
<header class="page-head">
  <div class="wrap-prose">
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</header>
<div class="wrap-prose page-body">
  {{- range (where .Site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <section class="archive-year">
    <h2>{{ .Key }}</h2>
    <ul class="archive-list">
      {{- range .Pages }}
      <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2" }}</time><a href="{{ .Permalink }}">{{ .Title }}</a></li>
      {{- end }}
    </ul>
  </section>
  {{- end }}
</div>
{{ end }}
